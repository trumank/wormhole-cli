[package]
name = "wormhole-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
bendy = "0.4"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.18.0"
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
ring = "0.17"
aes-gcm = "0.10"
base64 = "0.22"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
generic-array = "=0.14.7"
futures = "0.3"
